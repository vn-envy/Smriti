name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build pytest
          python -m build --wheel --outdir /tmp/smriti-dist
          pip install /tmp/smriti-dist/smriti_agents-*.whl
          cp -R tests /tmp/smriti-installed-tests
      - name: Run installed-wheel test suite (no network, no keys)
        working-directory: /tmp
        run: python -m pytest smriti-installed-tests/ --import-mode=importlib -q
