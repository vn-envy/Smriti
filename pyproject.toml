[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smriti-agents"
version = "0.3.2"
description = "Zero-infrastructure, local-first, bi-temporal memory layer for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
keywords = ["agents", "memory", "llm", "rag", "temporal"]
authors = [{ name = "Neekhil Vatsa", email = "vatsaneekhil@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/vn-envy/Smriti"
Repository = "https://github.com/vn-envy/Smriti"
Issues = "https://github.com/vn-envy/Smriti/issues"

[project.scripts]
smriti-mcp = "smriti.mcp_server:main"
smriti-doctor = "smriti.doctor:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["smriti*", "bench*"]

[tool.setuptools.package-data]
bench = ["comparative_dataset.json", "gbrain_growth_worker.ts", "gbrain_public_semantic_worker.ts"]
