# Netlify config for GitHub-connected deploys (repo root).
# Netlify reads this file when the site is linked to the GitHub repo:
# every push to main auto-deploys the site/ folder. No build step.

[build]
  publish = "site"
  command = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
