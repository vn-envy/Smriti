<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10162a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="0%" r="70%">
      <stop offset="0" stop-color="#F4A43C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F4A43C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1120" height="340" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="1120" height="340" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1119" height="339" rx="20" fill="none" stroke="#27314A"/>

  <!-- left: identity -->
  <text x="56" y="118" fill="#E8ECF5" font-size="64" font-weight="700" letter-spacing="-1">smriti
    <tspan fill="#F4A43C" font-size="40" font-weight="500" dx="14">स्मृति</tspan>
  </text>
  <text x="58" y="158" fill="#9aa3bb" font-size="21" font-weight="500">memory that knows <tspan fill="#F4A43C" font-weight="600">when</tspan></text>
  <text x="58" y="190" fill="#5C667E" font-size="14.5">A local-first, bi-temporal memory layer for AI agents.</text>

  <!-- chips -->
  <g font-size="12.5" font-family="'JetBrains Mono',monospace">
    <g><rect x="56" y="232" width="118" height="30" rx="15" fill="none" stroke="#323E5C"/><text x="115" y="251" fill="#E8ECF5" text-anchor="middle">one SQLite file</text></g>
    <g><rect x="184" y="232" width="92" height="30" rx="15" fill="none" stroke="#323E5C"/><text x="230" y="251" fill="#E8ECF5" text-anchor="middle">zero infra</text></g>
    <g><rect x="286" y="232" width="104" height="30" rx="15" fill="none" stroke="#323E5C"/><text x="338" y="251" fill="#E8ECF5" text-anchor="middle">Apache-2.0</text></g>
    <g><rect x="56" y="270" width="150" height="30" rx="15" fill="none" stroke="#323E5C"/><text x="131" y="289" fill="#E8ECF5" text-anchor="middle">stdlib + numpy only</text></g>
    <g><rect x="216" y="270" width="174" height="30" rx="15" fill="none" stroke="#323E5C"/><text x="303" y="289" fill="#E8ECF5" text-anchor="middle">drop-in MCP server</text></g>
  </g>

  <!-- right: the superpower, visualized -->
  <g transform="translate(620,56)">
    <rect x="0" y="0" width="444" height="228" rx="14" fill="#141B2D" stroke="#27314A"/>
    <text x="22" y="36" fill="#5C667E" font-size="12.5" font-family="'JetBrains Mono',monospace">mem.context("where do I live?")</text>
    <line x1="22" y1="50" x2="422" y2="50" stroke="#27314A"/>

    <!-- superseded fact -->
    <g transform="translate(22,72)">
      <rect x="0" y="0" width="400" height="58" rx="10" fill="#191f33" stroke="#2b3450"/>
      <text x="16" y="24" fill="#8A93AB" font-size="11" font-family="'JetBrains Mono',monospace">2026-01-15 · <tspan fill="#E08AA0">SUPERSEDED on 2026-06-01</tspan></text>
      <text x="16" y="44" fill="#9aa3bb" font-size="14.5">The user lives in Hyderabad.</text>
    </g>

    <!-- current fact -->
    <g transform="translate(22,142)">
      <rect x="0" y="0" width="400" height="58" rx="10" fill="#1d2236" stroke="#7a5a2c"/>
      <text x="16" y="24" fill="#8A93AB" font-size="11" font-family="'JetBrains Mono',monospace">2026-06-01 · <tspan fill="#F4A43C" font-weight="700">CURRENT</tspan></text>
      <text x="16" y="44" fill="#E8ECF5" font-size="14.5" font-weight="500">The user lives in Bengaluru.</text>
    </g>
  </g>

  <text x="620" y="312" fill="#5C667E" font-size="13">Updates supersede — never delete. Answer "now" and "before," with a full audit trail.</text>
</svg>
